name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # L1 (unit) and L2 (real ChemOnt fixtures) run here. L3 needs the 67 MB
      # sample_200k.tsv, which is not in the repo, so it skips. A skipped tier
      # normally exits 2 so it can never pass silently; ALLOW_SKIPPED_TIERS makes
      # that a declared exemption for CI only. The 2 GB dataset is never fetched
      # and points.bin is never generated: it is a deploy-time artefact.
      - name: Test suite (L1 + L2; L3 skipped, no sample in CI)
        env:
          ALLOW_SKIPPED_TIERS: "1"
        run: python3 scripts/test_checks.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
