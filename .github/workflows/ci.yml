name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # test_checks.py runs its L1 unit tests unconditionally and prints SKIP for
      # the L2/L3 levels whose inputs (../chemont_project/data/) are not in the
      # repo. It exits non-zero only on a real failure, so no gating is needed.
      # The 2 GB dataset is never downloaded and points.bin is never generated
      # here: 292 MB of vertex data is a deploy-time artefact, not a CI one.
      - run: python3 scripts/test_checks.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
