services:
  atlas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chemical-space-atlas
    ports:
      - "8080:80"
    volumes:
      # points.bin and layout.json, generated by the Python pipeline. Read-only:
      # nginx only serves them, and the pipeline rewrites them in place on the host.
      - ../frontend/public:/srv/atlas-data:ro
    restart: unless-stopped
