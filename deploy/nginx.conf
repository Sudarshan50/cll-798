worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        # No CSP: the app compiles WebGL2 shaders from strings and React sets
        # inline styles, both of which a default-src/style-src policy blocks.

        # 292 MB of int16 x,y pairs, streamed through fetch() + bufferSubData.
        # gzip is off: the data is high-entropy binary, so it compresses by almost
        # nothing while costing a full CPU pass over 292 MB per request. Range
        # requests stay on (nginx default) so an interrupted stream can resume
        # instead of restarting the whole transfer.
        location = /points.bin {
            root /srv/atlas-data;
            gzip off;
            default_type application/octet-stream;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # ~3.6 MB of JSON: gzip takes it to well under a megabyte, and it is
        # parsed in one go rather than streamed, so the decompression is free.
        location = /layout.json {
            root /srv/atlas-data;
            gzip on;
            gzip_types application/json;
            default_type application/json;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # Vite emits content-hashed filenames here, so they can never go stale.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
